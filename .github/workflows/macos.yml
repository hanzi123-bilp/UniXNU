name: macOS build

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: UniXNU/UniXNU-sheng
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name
        required: true
        default: sheng_defconfig
      steps:
        description: Steps to run
        type: choice
        options:
          - kernel
          - kernel userdata
          - kernel userdata payload
          - kernel payload
          - kernel payload firmware
        default: kernel userdata
      stage_b_experiment:
        description: Also run the stage B fixture + full-config rebuild experiment
        type: boolean
        default: false
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      trust_cache_url:
        description: Trust cache bundle URL (optional)
        required: false
        default: ""
      owner_trust_cache:
        description: Treat the trust cache URL as an owner-signed bundle
        type: boolean
        default: false
      data_seed_url:
        description: Data seed URL (optional)
        required: false
        default: ""
      grow_gib:
        description: Grow the Data seed to this many GiB (optional)
        required: false
        default: ""
      skip_setup:
        description: Mark Setup as done in the Data seed
        type: boolean
        default: false
      upload_userdata:
        description: Upload the userdata image (large)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools
        run: |
          # Jobs on this account are cancelled at 15 minutes, so only install
          # what the runner image does not already carry.
          for p in cmake ninja unifdef llvm lld mtools dtc; do
            brew list "$p" >/dev/null 2>&1 || brew install "$p"
          done
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Restore the XNU build tree
        # The job is cancelled at 15 minutes, so reuse the previous tree and
        # object files; only changed sources are recompiled.
        uses: actions/cache@v4
        with:
          path: |
            out/fuxi/tree/.cache/xnu-work
            out/fuxi/tree/build
          key: xnu2-${{ inputs.defconfig }}-${{ hashFiles('unixnu', 'scripts/**') }}
          restore-keys: |
            xnu2-${{ inputs.defconfig }}-

      - name: Select the device
        run: |
          ./unixnu defconfig "${{ inputs.defconfig }}" -D "$GITHUB_WORKSPACE/device"
          ./unixnu fetch

      - name: Publish the stage-A candidate for the display audit
        # The graphics audit wants a prelinked candidate under a fixed name.
        # Rather than depending on anyone's machine, reuse the kernel this
        # project already built in an earlier run and place it there.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T=out/fuxi/tree
          mkdir -p "$T/build/native-prelink"
          URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/12427855285/zip"
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}' -H "Authorization: Bearer $GITHUB_TOKEN" "$URL")
          curl -sL -o /tmp/stage-a.zip "$LOC"
          unzip -o -q /tmp/stage-a.zip -d /tmp/stage-a
          cp /tmp/stage-a/fuxi/kernel/kernel.macho "$T/build/native-prelink/native-owner-legacy-display-bootstrap-candidate.macho"
          cp /tmp/stage-a/fuxi/kernel/kernel.json  "$T/build/native-prelink/native-owner-legacy-display-bootstrap-candidate.json"
          ls -l "$T/build/native-prelink/"

      - name: Prepare inputs
        env:
          TRUST_CACHE_URL: ${{ inputs.trust_cache_url }}
          DATA_SEED_URL: ${{ inputs.data_seed_url }}
          GROW_GIB: ${{ inputs.grow_gib }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
        run: |
          if [ -n "$TRUST_CACHE_URL" ]; then
            curl -fL "$TRUST_CACHE_URL" -o "$RUNNER_TEMP/trustcache"
          fi
          if [ -n "$DATA_SEED_URL" ]; then
            curl -fL "$DATA_SEED_URL" -o "$RUNNER_TEMP/data.dbr"
            if [ -n "$GROW_GIB" ]; then
              python3 scripts/seed-data-grow.py --gib "$GROW_GIB" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"
              mv "$RUNNER_TEMP/data-grow.dbr" "$RUNNER_TEMP/data.dbr"
            fi
          elif [ -n "$GROW_GIB" ]; then
            echo "grow_gib needs data_seed_url" >&2
            exit 1
          fi
          if [ "$SKIP_SETUP" = "true" ] && [ ! -f "$RUNNER_TEMP/data.dbr" ]; then
            echo "skip_setup needs data_seed_url" >&2
            exit 1
          fi

      - name: Check out the firmware
        # The payload step needs the Mu-Silicium tree too: the panic screen is
        # patched with the font headers of Silicon/Silicium/.../FrameBufferSerialPortLib.
        if: contains(inputs.steps, 'firmware') || contains(inputs.steps, 'payload')
        uses: actions/checkout@v4
        with:
          repository: hanzi123-bilp/uefi-fuxi
          ref: fuxi
          path: uefi
          # The firmware step initializes only the Mu-Silicium submodules the
          # board lists; a recursive checkout would fetch every one of them.
          submodules: false
          fetch-depth: 1

      - name: Build kernel
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIXNU_STORAGE_HEADERS_ONLY: '1'
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build kernel "${args[@]}"

      - name: Prelink against the original kernelcache
        # Downloading the IPSW is by far the slowest step and a kernel-only run
        # does not need the prelinked image; keep it out of the 15 minute budget
        # unless a later step asks for it.
        if: contains(inputs.steps, 'payload') || contains(inputs.steps, 'prelink')
        continue-on-error: true
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build prelink "${args[@]}"

      - name: Stage B fixture and full rebuild
        if: inputs.stage_b_experiment && contains(inputs.steps, 'kernel')
        continue-on-error: true
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Observe the storage layout statically from the prelinked image: the
          # metaclass bytes are the candidate's own __DATA, so the assertions
          # still test the real object without needing a live capture.
          UNIXNU_STORAGE_STATIC: '1'
        run: |
          # Stage A produced a prelinked kernel. The storage and display audits
          # validate against a prelink candidate under this fixed name, so give
          # them exactly that, then rebuild with the full configuration.
          T=out/fuxi/tree
          mkdir -p "$T/build/native-prelink"
          cp out/fuxi/kernel/kernel.macho "$T/build/native-prelink/native-apfs-load-positive.macho"
          cp out/fuxi/kernel/kernel.json  "$T/build/native-prelink/native-apfs-load-positive.json"
          # build-sheng-platform-power.py accepts any later candidate built from the
          # same original kernelcache, so publish ours under the name it looks for.
          cp out/fuxi/kernel/kernel.macho "$T/build/native-prelink/native-owner-ufs-rootauth3-candidate.macho"
          cp out/fuxi/kernel/kernel.json  "$T/build/native-prelink/native-owner-ufs-rootauth3-candidate.json"
          ls -l "$T/build/native-prelink/"
          cp device/board.full.toml device/board.toml
          ./unixnu defconfig fuxi_full_defconfig
          ./unixnu build kernel

      - name: Diagnose the kernel tree
        if: always()
        run: |
          set +e
          T=$(ls -d out/*/tree 2>/dev/null | head -1)
          echo "== tree: $T"
          echo "== storage-abi/include"; ls -la "$T/build/storage-abi/include" 2>&1 | head -20
          echo "== kits"; ls "$T/kits" 2>&1 | head -20
          echo "== xnu iokit"; ls "$T/.cache/xnu-work/iokit" 2>&1 | head -20
          echo "== IOBlockStorageDevice.h"; find "$T" -name IOBlockStorageDevice.h 2>/dev/null | head
          echo "== storage headers"; find "$T" -path '*storage*' -name '*.h' 2>/dev/null | head -20
          echo "== payload and boot logs"
          for f in out/*/logs/*.log; do
            [ -f "$f" ] || continue
            case "$f" in *kernel.log|*package.log|*firmware.log|*kernel-bootstrap.log) continue;; esac
            echo "--- $f"; tail -30 "$f"
          done
          echo "== archives on the link line"
          grep -oE '[^ ]+\.a\b' "$T"/logs/kernel.log 2>/dev/null | sort -u | head -40
          echo "== stub symbol in archives"
          for a in "$T"/build/*/lib*.a; do nm -A "$a" 2>/dev/null | grep -c native_legacy_display_probe | sed "s|^|$a: |"; done

      - name: Build userdata
        if: contains(inputs.steps, 'userdata')
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build userdata "${args[@]}"

      - name: Build payload
        if: contains(inputs.steps, 'payload')
        env:
          # payload.py reads the seed from --unique-chip-id or UNIXNU_UNIQUE_CHIP_ID;
          # board.toml only marks it as required. Keep the value in the repository so
          # an unattended run does not depend on a secret being set.
          UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID || '0x65776a976f4771da' }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
          OWNER_TRUST_CACHE: ${{ inputs.owner_trust_cache }}
          # Font headers for the panic-screen patch of the payload kernel.
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/trustcache" ]; then
            if [ "$OWNER_TRUST_CACHE" = "true" ]; then
              args+=(--owner-trust-cache "$RUNNER_TEMP/trustcache")
            else
              args+=(--trust-cache "$RUNNER_TEMP/trustcache")
            fi
          fi
          if [ -f "$RUNNER_TEMP/data.dbr" ]; then args+=(--data-ramdisk "$RUNNER_TEMP/data.dbr"); fi
          if [ -n "$UNIQUE_CHIP_ID" ]; then args+=(--unique-chip-id "$UNIQUE_CHIP_ID"); fi
          if [ "$SKIP_SETUP" = "true" ]; then args+=(--skip-setup); fi
          status=0
          ./unixnu build payload "${args[@]}" || status=$?
          if [ "$status" -ne 0 ]; then
            for f in out/*/logs/payload*.log; do
              [ -f "$f" ] || continue
              echo "--- $f"; tail -40 "$f"
            done
          fi
          exit "$status"

      - name: Build the firmware volume
        if: contains(inputs.steps, 'firmware')
        env:
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
        run: |
          ./unixnu build package firmware

      - name: Pack the boot image
        if: contains(inputs.steps, 'firmware')
        env:
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
          UNIXNU_DTB: ${{ github.workspace }}/uefi/Resources/DTBs/fuxi.dtb
        run: |
          ./unixnu bootimg --dtb "$UNIXNU_DTB"

      - name: Upload kernel and payload
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-${{ inputs.defconfig }}
          path: |
            out/*/kernel/**
            out/*/payload/**
            out/*/boot/**
            out/*/logs/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload userdata
        if: inputs.upload_userdata && contains(inputs.steps, 'userdata')
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-userdata-${{ inputs.defconfig }}
          path: out/*/userdata/**
          if-no-files-found: error
          retention-days: 7
